  <!-- НАЗВАНИЕ И ТЕКСТ НА ВХОДЕ: меняйте здесь -->
  <h1 class="gate__name">chaosformalbum</h1>
  <p class="gate__text">A small archive of faces best left forgotten.</p>

  <form class="gate__form" id="form" novalidate>
    <label class="visually-hidden" for="pw">Password</label>
    <input id="pw" name="password" type="password" placeholder="password"
           autocomplete="current-password" autocapitalize="off" spellcheck="false">
    <button type="submit" id="go">Enter</button>
    <p class="gate__msg" id="msg" role="status" aria-live="polite"></p>
  </form>
</main>

<div class="veil" id="veil" aria-hidden="true"></div>

<script src="assets/lock.js"></script>
<script>
(function () {
  "use strict";
  var form = document.getElementById("form");
  var input = document.getElementById("pw");
  var btn = document.getElementById("go");
  var msg = document.getElementById("msg");
  var mark = document.getElementById("mark");
  var veil = document.getElementById("veil");
  var calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var busy = false;

  if (!window.Lock || !Lock.supported()) {
    msg.textContent = "This browser cannot decrypt the gallery. Open the site over https in an up-to-date browser.";
    btn.disabled = true;
    return;
  }

  // Подгружаем каталог заранее, чтобы вход был быстрым
  Lock.loadCatalog("").catch(function () {
    msg.textContent = "The gallery data folder was not found.";
  });

  input.focus({ preventScroll: true });
  input.addEventListener("input", function () { if (msg.textContent) msg.textContent = ""; });

  function restart(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth; // перезапуск анимации
    el.classList.add(cls);
  }

  function refuse() {
    restart(mark, "is-glitch");
    restart(form, "is-shake");
    input.select();
  }

  function admit() {
    document.body.classList.add("is-opening");
    setTimeout(function () { veil.classList.add("is-on"); }, calm ? 0 : 380);
    setTimeout(function () { location.href = "gallery.html"; }, calm ? 350 : 1150);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    if (busy) return;
    if (!input.value.trim()) { input.focus(); return; }
    busy = true;
    btn.disabled = true;
    btn.textContent = "Opening…";

    Lock.unlock(input.value, "")
      .then(function (res) { return Lock.saveKey(res.key); })
      .then(admit)
      .catch(function (err) {
        busy = false;
        btn.disabled = false;
        btn.textContent = "Enter";
        if (err && err.name === "OperationError") refuse();
        else { msg.textContent = "Could not open the gallery. Please reload the page."; console.error(err); }
      });
  });
})();
</script>
